name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pip install -e . --no-deps
      - run: ruff check .
      - run: pytest --cov=ghostroom --cov-report=term-missing

  train:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - run: pip install -e . --no-deps
      - name: fetch data, run every study
        run: ghostroom run
      - name: print headline numbers
        run: ghostroom show
      - uses: actions/upload-artifact@v4
        with:
          name: ghostroom-model
          path: |
            outputs/metrics.json
            outputs/ghostroom_model.joblib
            assets/*.png
